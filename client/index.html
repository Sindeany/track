    <!-- Self-healing resilience script for Safari iOS & stale service worker caches -->
    <script>
      (function() {
        window.addEventListener('error', function(e) {
          var msg = (e && (e.message || (e.error && e.error.message))) || '';
          if (
            msg.indexOf('Unexpected token') !== -1 ||
            msg.indexOf('Failed to fetch dynamically imported module') !== -1 ||
            msg.indexOf('Loading chunk') !== -1 ||
            msg.indexOf('client.navigate') !== -1
          ) {
            try {
              if (!sessionStorage.getItem('safari_cache_recovery_run')) {
                sessionStorage.setItem('safari_cache_recovery_run', '1');
                if (window.caches) {
                  caches.keys().then(function(names) {
                    names.forEach(function(n) { caches.delete(n); });
                  });
                }
                if (navigator.serviceWorker) {
                  navigator.serviceWorker.getRegistrations().then(function(regs) {
                    regs.forEach(function(r) { r.unregister(); });
                  });
                }
                setTimeout(function() { window.location.reload(); }, 100);
              }
            } catch (err) {
              // Ignore storage errors in restricted private mode
            }
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Branded initial shell to eliminate any blank white screen while scripts load -->
      <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: #F4F7F7; font-family: 'Tajawal', system-ui, -apple-system, sans-serif; direction: rtl;">

        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
