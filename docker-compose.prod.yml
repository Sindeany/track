# Production stack. MySQL is not published on the host.
# docker compose -f docker-compose.prod.yml up -d --build
# Do not run this at the same time as the dev database profile.

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-field_visits}
      MYSQL_USER: ${MYSQL_USER:-fieldvisits}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes:
      - field_visits_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      UPLOAD_DIR: /app/uploads
      TRUST_PROXY: "1"
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Riyadh}
      DATABASE_URL: mysql://${MYSQL_USER:-fieldvisits}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-field_visits}
    expose:
      - "3000"
    volumes:
      - field_visits_uploads:/app/uploads

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS to the public hostname}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  field_visits_mysql:
  field_visits_uploads:
  caddy_data:
  caddy_config:
